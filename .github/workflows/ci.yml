name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: receiptbox
          POSTGRES_PASSWORD: receiptbox
          POSTGRES_DB: receiptbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receiptbox -d receiptbox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Test-only values; there are no real secrets in CI.
      JWT_SECRET: ci-only-jwt-secret-not-real-0123456789abcdef
      TEST_DATABASE_URL: postgresql+asyncpg://receiptbox:receiptbox@127.0.0.1:5432/receiptbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get
      # Riverpod providers are generated (*.g.dart are git-ignored).
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
