[project]
name = "receiptbox-experiments"
version = "0.1.0"
description = "ReceiptBox AI evaluation harness (P15, spec 19): E1-E4"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The backend's runtime dependencies: the experiments import backend/app (put on sys.path).
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23",
    "pyjwt>=2.8",
    "google-genai>=3.6.1",
    "tzdata>=2026.6",
    "rapidfuzz>=3.14.6",
    "fastapi>=0.115",
    "python-multipart>=0.0.34",
    # New for P15:
    "numpy>=2.0",          # bootstrap confidence intervals, PR curves
    "scikit-learn>=1.5",   # E2 logistic regression with 5-fold cross-validation
    "matplotlib>=3.9",     # figures for docs/report_assets
    "pyyaml>=6.0",         # experiment configs and the E3 question set
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["make_synthetic_samples.py", "run_bank_extract_manual.py", "run_extract_manual.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
# `rbx_eval` puts backend/ on sys.path, so it must be imported before the backend's `app`.
known-first-party = ["app"]
section-order = ["future", "standard-library", "bootstrap", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
bootstrap = ["rbx_eval"]

