name: receiptbox

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: receiptbox
      POSTGRES_PASSWORD: receiptbox # development only; the port below is bound to localhost
      POSTGRES_DB: receiptbox
    ports:
      # Host port 5433 (not 5432) so it does not clash with a PostgreSQL installed on Windows.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptbox -d receiptbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    depends_on:
      db:
        condition: service_healthy
    # Later files override earlier ones: dev defaults first, then your own repo-root .env.
    # This way `up -d` works before you create a .env.
    env_file:
      - path: ./dev-defaults.env
      - path: ../.env
        required: false
    environment:
      # `environment` wins over env_file. Inside the compose network the DB host is `db`.
      DATABASE_URL: postgresql+asyncpg://receiptbox:receiptbox@db:5432/receiptbox
      STORAGE_ROOT: /app/storage
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data:
